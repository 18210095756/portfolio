  svg { display:block; margin:0 auto; color:#f2ebdc; }
  .hex { display:flex; align-items:center; justify-content:center; width:74px; height:85px; margin:0 auto;
         background:rgba(242,235,220,.02); clip-path:polygon(50% 2%,98% 26%,98% 74%,50% 98%,2% 74%,2% 26%); }
</style>

function svg(c, size) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" '
    + 'stroke="currentColor" stroke-width="' + c.sw + '" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="' + c.d + '"/></svg>';
}
function solidSvg(size) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="currentColor">'
    + '<path d="' + SOLID + '"/></svg>';
}
function build(hostId, size, inHex) {
  var host = document.getElementById(hostId);
  CAND.forEach(function (c) {
    var d = document.createElement('div');
    d.className = 'cell';
    var inner = svg(c, size);
    d.innerHTML = (inHex ? '<div class="hex">' + inner + '</div>' : inner)
      + '<div class="cap">' + c.key + '. ' + c.name + '</div><div class="sub">' + c.sub + '</div>';
    host.appendChild(d);
  });
  var d = document.createElement('div');
  d.className = 'cell';
  var inner = solidSvg(size);
  d.innerHTML = (inHex ? '<div class="hex">' + inner + '</div>' : inner)
    + '<div class="cap">D. 实心填充</div><div class="sub">simple-icons fill</div>';
  host.appendChild(d);
}
build('r25', 25, false);
build('r37', 37, false);
build('rhex', 25, true);
