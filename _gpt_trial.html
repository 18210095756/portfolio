<!doctype html>
<meta charset="utf-8">
<title>GPT single-line stroke-width trial</title>
<style>
  body { background:#0b0b10; color:#f2ebdc; font:12px/1.4 Inter,system-ui,sans-serif; margin:0; padding:22px; }
  h2 { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
       color:rgba(242,235,220,.55); margin:20px 0 10px; }
  .row { display:flex; gap:26px; align-items:flex-end; flex-wrap:wrap; }
  .cell { text-align:center; }
  .cap { margin-top:7px; font-size:10px; color:rgba(242,235,220,.5); letter-spacing:.06em; }
  svg { display:block; color:#f2ebdc; }
</style>
<!-- 真实渲染尺寸：静止 25px（1600x900 桌面档），悬停放大 ~37px -->
<h2>25px — 静止态（桌面实测 ico=25x25）</h2>
<div class="row" id="r25"></div>
<h2>37px — 悬停放大态（Dock 1.47x）</h2>
<div class="row" id="r37"></div>
<h2>33px — 窄屏静止态（900x1200 实测 ico=33x33）</h2>
<div class="row" id="r33"></div>

<h2>邻格参照（Ps sw1.45 / Ai sw1.45 / Codex sw13.87@256）— 25px</h2>
<div class="row" id="rref"></div>

<script>
var GPT = 'M12.959 5.5A3 3 0 0 0 7 6v5l4.768 2.86m6.34-4.28a3 3 0 0 0-3.412-4.91l-4.33 2.5l-.093 5.56m6.877 3.35a3 3 0 0 0 2.546-5.41l-4.33-2.5l-4.861 2.699m.537 7.631A3 3 0 0 0 17 18v-5l-4.768-2.86m-6.34 4.28a3 3 0 0 0 3.412 4.91l4.33-2.5l.093-5.56M6.85 7.92a3 3 0 0 0-2.546 5.41l4.33 2.5l4.861-2.699';
var PS  = 'M2.4 0C1.1 0 0 1.1 0 2.4v19.2C0 22.9 1.1 24 2.4 24h19.2c1.3 0 2.4-1.1 2.4-2.4V2.4C24 1.1 22.9 0 21.6 0zM4.9 6.1c0-.1.1-.2.2-.2h3.9c1.9 0 3.5 1.2 3.5 3.4 0 2.5-1.8 3.6-3.7 3.6H7.3v3c0 .1 0 .2-.2.2H5.1c-.1 0-.2 0-.2-.2zm2.4 1.9v2.9h1.3c.8 0 1.5-.4 1.5-1.5 0-.9-.5-1.4-1.4-1.4z';
var widths = [1.0, 1.15, 1.3, 1.45];

function mk(size, sw, label) {
  var d = document.createElement('div');
  d.className = 'cell';
  d.innerHTML = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" '
    + 'stroke="currentColor" stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="' + GPT + '"/></svg>'
    + '<div class="cap">' + (label || ('sw ' + sw)) + '</div>';
  return d;
}
[['r25',25],['r37',37],['r33',33]].forEach(function(p){
  var host = document.getElementById(p[0]);
  widths.forEach(function(sw){ host.appendChild(mk(p[1], sw)); });
});

/* reference: existing neighbours at 25px so the optical weight can be matched */
var ref = document.getElementById('rref');
function raw(html, cap) {
  var d = document.createElement('div'); d.className = 'cell';
  d.innerHTML = html + '<div class="cap">' + cap + '</div>';
  ref.appendChild(d);
}
raw('<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="' + PS + '"/></svg>', 'Ps sw1.45');
widths.forEach(function(sw){ ref.appendChild(mk(25, sw, 'GPT ' + sw)); });
</script>
